name: Docs translate

on:
  workflow_dispatch:
    inputs:
      target_languages:
        description: "Comma-separated target languages"
        required: false
        default: "en_US,es_ES,de_DE,it_IT,pt_PT"
  push:
    branches:
      - dev
    paths:
      - docs/fr_FR/*.md
  pull_request:
    branches:
      - dev
    paths:
      - docs/fr_FR/*.md

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: Mips2648/docs-translations@v3
        with:
            deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
            target_languages: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_languages || 'en_US,es_ES,de_DE,it_IT,pt_PT' }}